<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Face Pay Admin{% endblock %}</title>
  <style>
    :root { --brand: #22529f; --ink: #1d2433; --muted: #6e7885; --line: #e3e7ee; --bg: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { background: linear-gradient(120deg, #07194f, #22529f); color: #fff; padding: 18px 24px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    header b { font-size: 18px; margin-right: auto; }
    header a { color: #fff; opacity: .85; text-decoration: none; font-weight: 600; font-size: 14px; }
    header a:hover { opacity: 1; }
    main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15,30,70,.06); margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0 0 14px; } h2 { font-size: 17px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .ok { background: #e3f6ea; color: #1b7f43; } .no { background: #f1f2f5; color: var(--muted); } .bad { background: #fde8e8; color: #b42318; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    input, select { width: 100%; max-width: 360px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    button, .btn { display: inline-block; margin-top: 16px; padding: 11px 20px; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <b>TDB Face Pay · Admin</b>
    <a href="{{ url_for('home') }}">Хэрэглэгчид</a>
    <a href="{{ url_for('register') }}">Хэрэглэгч бүртгэх</a>
    <a href="{{ url_for('payment') }}">Энгийн төлбөр</a>
    <a href="{{ url_for('transactions') }}">Гүйлгээний түүх</a>
    <a href="{{ url_for('biometric_payment_page') }}">POS терминал ↗</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
